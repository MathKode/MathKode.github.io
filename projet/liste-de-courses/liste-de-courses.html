<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Borne — ma liste de courses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --vert:#14342B;
  --vert-clair:#1D4A3C;
  --moutarde:#E8B33C;
  --tomate:#C8452F;
  --papier:#F4F3ED;
  --carte:#FFFFFF;
  --encre:#16180F;
  --gris:#6E7268;
  --trait:#DCDACE;
  --ticket:#FBFAF4;
  --r:14px;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,sans-serif;
  --mono:"Courier Prime",ui-monospace,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--body);
  background:var(--papier);
  color:var(--encre);
  -webkit-font-smoothing:antialiased;
  padding-bottom:96px;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--moutarde);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Bandeau ---------- */
.bandeau{position:sticky;top:0;z-index:40;background:var(--vert);color:#F4F3ED}
.bandeau-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em;line-height:1;display:flex;align-items:center;gap:9px}
.logo span{display:block;background:var(--moutarde);color:var(--vert);border-radius:8px;padding:5px 7px;font-size:15px}
.logo small{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.62;margin-top:3px}
.bandeau-actions{margin-left:auto;display:flex;align-items:center;gap:10px}

.pers{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.1);border-radius:999px;padding:4px}
.pers b{font-family:var(--display);font-size:15px;min-width:58px;text-align:center;font-weight:700}
.pers b i{font-style:normal;font-weight:500;font-size:11px;opacity:.7}
.rond{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:17px;font-weight:600;line-height:1}
.rond:hover{background:var(--moutarde);color:var(--vert)}


/* ---------- Recherche ---------- */
.zone{max-width:1180px;margin:0 auto;padding:0 16px}
.chercher{position:relative;margin:22px 0 14px}
.chercher input{
  width:100%;font:500 17px/1 var(--body);padding:16px 16px 16px 48px;
  border:2px solid var(--trait);border-radius:var(--r);background:var(--carte);color:var(--encre);
}
.chercher input::-webkit-search-decoration,
.chercher input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.chercher input::placeholder{color:var(--gris)}
.chercher input:focus{border-color:var(--vert);outline:none}
.chercher svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--gris)}
.effacer{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;color:var(--gris);font-size:18px}
.effacer:hover{background:var(--trait)}

.onglets{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;scrollbar-width:none}
.onglets::-webkit-scrollbar{display:none}
.onglet{white-space:nowrap;padding:9px 15px;border-radius:999px;border:2px solid var(--trait);background:var(--carte);font-weight:600;font-size:14px;color:var(--gris)}
.onglet[aria-selected="true"]{background:var(--vert);border-color:var(--vert);color:#fff}

/* ---------- Grille de plats ---------- */
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px;padding-bottom:32px}
.plat{
  background:var(--carte);border:2px solid var(--trait);border-radius:var(--r);
  padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:132px;
  transition:transform .12s ease,border-color .12s ease;
}
.plat:hover{border-color:var(--vert);transform:translateY(-2px)}
.plat .emo{font-size:30px;line-height:1}
.plat .nom{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.18;letter-spacing:-.01em}
.plat .meta{margin-top:auto;font-size:12px;color:var(--gris);display:flex;align-items:center;gap:6px}
.pastille{background:var(--vert);color:#fff;border-radius:999px;width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:700;font-family:var(--display)}
.vide{padding:48px 8px;text-align:center;color:var(--gris)}
.vide b{display:block;font-family:var(--display);font-size:19px;color:var(--encre);margin-bottom:6px}

.titre-section{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gris);margin:6px 0 12px;grid-column:1/-1;display:flex;align-items:center;gap:8px}
.titre-section span{font-size:11px;letter-spacing:0;background:var(--trait);color:var(--gris);border-radius:999px;padding:2px 8px}
.plat .emo{position:relative}
.eclair{position:absolute;left:24px;top:-2px;font-size:13px;font-style:normal;line-height:1}

/* ---------- Barre panier ---------- */
.barre{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--papier) 62%,transparent)}
.barre-in{max-width:1180px;margin:0 auto;display:flex;gap:10px}
.barre button{flex:1;border-radius:999px;padding:15px 18px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px}
.b-panier{background:var(--carte);border:2px solid var(--vert);color:var(--vert)}
.b-liste{background:var(--vert);color:#fff;box-shadow:0 6px 18px rgba(20,52,43,.25)}
.b-liste:disabled,.b-panier:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}

/* ---------- Feuille modale ---------- */
.voile{position:fixed;inset:0;background:rgba(22,24,15,.5);z-index:80;display:flex;align-items:flex-end;justify-content:center;padding:0}
.voile[hidden]{display:none}
.feuille{
  background:var(--papier);width:100%;max-width:620px;max-height:92vh;
  border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;
  animation:monte .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes monte{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.feuille-tete{padding:18px 18px 12px;border-bottom:2px solid var(--trait);display:flex;gap:14px;align-items:flex-start;background:var(--carte)}
.feuille-tete .emo{font-size:34px;line-height:1}
.feuille-tete h2{font-family:var(--display);font-weight:800;font-size:23px;margin:0;letter-spacing:-.02em;line-height:1.1}
.feuille-tete p{margin:4px 0 0;font-size:13px;color:var(--gris)}
.liens{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:8px}
.marmiton{display:inline-block;font-size:12.5px;font-weight:600;color:var(--vert);text-decoration:underline;text-underline-offset:3px}
.marmiton:hover{color:var(--tomate)}
.marmiton.exacte{
  background:var(--moutarde);color:var(--vert);text-decoration:none;
  border-radius:999px;padding:5px 11px;font-weight:700;
}
.marmiton.exacte:hover{background:var(--tomate);color:#fff}
.marmiton.floue{color:var(--gris);font-weight:500}
.marmiton.floue:hover{color:var(--tomate)}
.avec{color:var(--vert);font-weight:600}
.fermer{margin-left:auto;width:36px;height:36px;border-radius:50%;background:var(--papier);font-size:20px;display:grid;place-items:center;flex:none}
.feuille-corps{overflow-y:auto;padding:18px;-webkit-overflow-scrolling:touch}
.feuille-pied{padding:14px 18px calc(14px + env(safe-area-inset-bottom));border-top:2px solid var(--trait);background:var(--carte);display:flex;gap:10px}
.feuille-pied button{flex:1;border-radius:999px;padding:15px;font-weight:600;font-size:15px}
.b-valider{background:var(--vert);color:#fff}
.b-retirer{background:var(--carte);border:2px solid var(--tomate);color:var(--tomate);flex:0 0 auto!important;padding:15px 20px!important}

/* portions */
.portions{background:var(--carte);border:2px solid var(--trait);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:18px}
.portions .lab{font-weight:600;font-size:15px}
.portions .lab i{display:block;font-style:normal;font-size:12px;color:var(--gris);font-weight:400;margin-top:2px}
.portions .cmd{margin-left:auto;display:flex;align-items:center;gap:4px}
.portions .cmd button{width:38px;height:38px;border-radius:50%;background:var(--papier);border:2px solid var(--trait);font-size:19px;font-weight:600;display:grid;place-items:center}
.portions .cmd button:hover{border-color:var(--vert)}
.portions .cmd b{font-family:var(--display);font-size:19px;min-width:38px;text-align:center}

.legende{font-size:13px;color:var(--gris);margin:0 0 10px;line-height:1.45}
.ingr{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ingr li{background:var(--carte);border:2px solid var(--trait);border-radius:12px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px}
.ingr li.off{opacity:.45;border-style:dashed}
.ingr .nm{font-weight:500;font-size:14.5px;line-height:1.25}
.ingr li.off .nm{text-decoration:line-through}
.ingr .nm i{display:block;font-style:normal;font-size:11.5px;color:var(--gris);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;text-decoration:none}
.ingr .cmd{margin-left:auto;display:flex;align-items:center;gap:3px;flex:none}
.ingr .cmd button{width:32px;height:32px;border-radius:50%;background:var(--papier);font-size:17px;font-weight:700;display:grid;place-items:center;color:var(--vert)}
.ingr .cmd button:hover{background:var(--moutarde)}
.ingr .cmd b{font-family:var(--mono);font-weight:700;font-size:13.5px;min-width:64px;text-align:center}
.ingr li.off .cmd b{color:var(--gris)}
.ingr .jeter{width:32px;height:32px;border-radius:50%;margin-left:7px;display:grid;place-items:center;color:var(--gris);flex:none}
.ingr .jeter:hover{background:var(--tomate);color:#fff}
.ingr li.off .jeter{color:var(--vert)}
.ingr li.off .jeter:hover{background:var(--vert);color:#fff}

/* suggestions */
.sugg h3{font-family:var(--display);font-weight:800;font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
.sugg-titre{display:flex;align-items:center;gap:8px;font-size:15px!important;margin:0 0 10px!important}
.sugg-titre span{font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:0;background:var(--trait);color:var(--gris);border-radius:999px;padding:2px 8px}
.sugg-titre.suivant{margin-top:22px!important;padding-top:18px;border-top:2px dashed var(--trait)}
.sugg-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:0}

/* ---------- Panier ---------- */
.panier{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.panier li{background:var(--carte);border:2px solid var(--trait);border-radius:12px;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px}
.panier .emo{font-size:24px}
.panier .nm{font-weight:600;font-size:15px}
.panier .nm i{display:block;font-style:normal;font-weight:400;font-size:12.5px;color:var(--gris);margin-top:2px}
.panier .modif{margin-left:auto;font-size:13px;font-weight:600;color:var(--vert);text-decoration:underline;text-underline-offset:3px;padding:6px}
.panier .sup{width:34px;height:34px;border-radius:50%;background:var(--papier);color:var(--tomate);font-size:17px;display:grid;place-items:center;flex:none}

/* ---------- Ticket ---------- */
.ecran{position:fixed;inset:0;z-index:70;background:var(--vert);overflow-y:auto;-webkit-overflow-scrolling:touch}
.ecran[hidden]{display:none}
.ecran-tete{position:sticky;top:0;z-index:2;background:var(--vert);display:flex;align-items:center;gap:10px;padding:14px 16px;max-width:760px;margin:0 auto;color:#fff}
.ecran-tete h2{font-family:var(--display);font-weight:800;font-size:19px;margin:0;letter-spacing:-.01em}
.ecran-tete .fermer{background:rgba(255,255,255,.14);color:#fff}
.outils{margin-left:auto;display:flex;gap:8px}
.outils button{background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:9px 14px;font-size:13.5px;font-weight:600}
.outils button:hover{background:var(--moutarde);color:var(--vert)}

.papier-wrap{max-width:560px;margin:0 auto;padding:4px 16px 64px;filter:drop-shadow(0 14px 30px rgba(0,0,0,.3))}
.papier{
  --s:16px;
  background:var(--ticket);padding:38px 26px 44px;
  font-family:var(--mono);font-size:14px;line-height:1.55;color:#22241a;
  -webkit-mask:
    conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/var(--s) calc(var(--s)/2) repeat-x,
    conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) top/var(--s) calc(var(--s)/2) repeat-x,
    linear-gradient(#000,#000) center/100% calc(100% - var(--s)) no-repeat;
  mask:
    conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/var(--s) calc(var(--s)/2) repeat-x,
    conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) top/var(--s) calc(var(--s)/2) repeat-x,
    linear-gradient(#000,#000) center/100% calc(100% - var(--s)) no-repeat;
}
.t-tete{text-align:center;margin-bottom:20px}
.t-tete h1{font-family:var(--mono);font-weight:700;font-size:19px;letter-spacing:.22em;margin:0 0 6px}
.t-tete p{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.sep{border-top:1px dashed #9a9a86;margin:16px 0}
.sep-forte{border-top:2px solid #22241a;margin:16px 0}
.t-titre{font-weight:700;letter-spacing:.16em;font-size:12px;text-transform:uppercase;margin:0 0 8px}
.t-plat{margin:0 0 16px}
.t-plat-nom{font-weight:700;display:flex;gap:8px;align-items:baseline;text-transform:uppercase;letter-spacing:.04em}
.t-plat-nom .pf{margin-left:auto;font-weight:400;font-size:12px;white-space:nowrap}
.lg{display:flex;align-items:baseline;gap:6px;font-size:13px}
.lg .p{flex:none}
.lg .fil{flex:1;border-bottom:1px dotted #a9a996;transform:translateY(-3px)}
.lg .q{flex:none;white-space:nowrap}
.t-plat .lg{padding-left:12px}
.rayon{font-weight:700;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;margin:14px 0 6px;color:#5d6152}
.rayon:first-child{margin-top:0}
.case{display:flex;align-items:baseline;gap:6px;font-size:13.5px;padding:2px 0}
.case input{appearance:none;width:14px;height:14px;border:1.5px solid #22241a;flex:none;position:relative;top:2px;cursor:pointer;background:transparent}
.case input:checked{background:#22241a}
.case input:checked+.p{text-decoration:line-through;opacity:.45}
.case input:checked~.fil,.case input:checked~.q{opacity:.45}
.reste{font-size:12.5px;padding:3px 0;display:flex;gap:6px;align-items:baseline}
.reste .q{margin-left:auto;white-space:nowrap;font-weight:700}
.t-pied{text-align:center;margin-top:22px;font-size:12px;letter-spacing:.05em}
.codebarres{height:38px;margin:14px auto 8px;max-width:220px;background:repeating-linear-gradient(90deg,#22241a 0 2px,transparent 2px 4px,#22241a 4px 5px,transparent 5px 9px,#22241a 9px 12px,transparent 12px 14px)}

/* ---------- Ajouts hors recette ---------- */
.b-ajout{background:transparent;border:2px dashed var(--trait);color:var(--gris);font-weight:600}
.b-ajout:hover{border-color:var(--vert);color:var(--vert);background:var(--carte)}
.barre .b-ajout{flex:0 0 auto;padding:15px 16px;gap:5px;font-size:14px}
.barre .court{display:none}
.ajout-ligne{width:100%;margin-top:10px;padding:13px;border:2px dashed var(--trait);border-radius:12px;color:var(--gris);font-weight:600;font-size:14px;text-align:center;background:transparent}
.ajout-ligne:hover{border-color:var(--vert);color:var(--vert);background:var(--carte)}
.ingr.ajouts{margin-top:8px}
.ingr.ajouts li{border-style:dashed}
.titre-mini{font-family:var(--display);font-weight:800;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--gris);margin:0 0 8px}

.rech-prod input{width:100%;font:500 16px/1 var(--body);padding:13px 14px;border:2px solid var(--trait);border-radius:12px;background:var(--carte);color:var(--encre);margin-bottom:14px}
.rech-prod input:focus{border-color:var(--vert);outline:none}
.rech-prod input::-webkit-search-decoration,
.rech-prod input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.res{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:44vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.res button{width:100%;text-align:left;background:var(--carte);border:2px solid var(--trait);border-radius:10px;padding:11px 12px;display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:500}
.res button:hover{border-color:var(--vert)}
.res .ray{margin-left:auto;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--gris);flex:none}
.res .neuf{border-style:dashed;color:var(--vert);font-weight:700}
.unites{display:flex;gap:6px;margin:0 0 10px}
.unites button{border:2px solid var(--trait);background:var(--carte);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--gris)}
.unites button[aria-pressed="true"]{border-color:var(--vert);background:var(--vert);color:#fff}
.choisis{margin-bottom:18px}

/* ---------- Partage ---------- */
.b-second{background:var(--carte);border:2px solid var(--vert);color:var(--vert);flex:0 0 auto!important;padding:15px 20px!important}
.lien{width:100%;font-family:var(--mono);font-size:12.5px;line-height:1.5;padding:12px;border:2px solid var(--trait);border-radius:12px;background:var(--carte);color:var(--encre);resize:vertical;word-break:break-all}
.lien:focus{border-color:var(--vert);outline:none}

@media (max-width:560px){
  /* La place manque : le bouton du milieu se réduit à son +, les libellés raccourcissent. */
  .barre .long{display:none}
  .barre .court{display:inline}
  .barre .b-ajout .court{display:none}
  .barre .b-ajout{padding:15px 15px;font-size:17px;line-height:1}
  .barre button{flex:1 1 auto;white-space:nowrap;padding:15px 12px;font-size:14px;gap:7px}
  .barre{padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
  .barre-in{gap:8px}
  /* Sur téléphone les trois actions passent avant le titre : le ticket parle de lui-même. */
  .ecran-tete{gap:8px;padding:14px 12px}
  .ecran-tete h2{display:none}
  .outils{gap:6px}
  .outils button{padding:9px 11px;font-size:12.5px}
}
@media (min-width:700px){
  .voile{align-items:center;padding:24px}
  .feuille{border-radius:20px;max-height:86vh}
  body{padding-bottom:110px}
  .plat{min-height:146px}
}
@media print{
  body>*:not(.ecran){display:none!important}
  .ecran{position:static;background:#fff;overflow:visible}
  .ecran-tete{display:none!important}
  .papier-wrap{filter:none;max-width:none;padding:0}
  .papier{-webkit-mask:none;mask:none;background:#fff;padding:0}
  .case input{-webkit-print-color-adjust:exact}
}
</style>
</head>
<body>

<header class="bandeau">
  <div class="bandeau-in">
    <div class="logo"><span>🛒</span><div>La Borne<small>liste de courses signée E+M</small></div></div>
    <div class="bandeau-actions">
      <div class="pers" role="group" aria-label="Nombre de personnes">
        <button class="rond" id="pers-moins" aria-label="Une personne de moins">−</button>
        <b id="pers-nb">4<i>pers.</i></b>
        <button class="rond" id="pers-plus" aria-label="Une personne de plus">+</button>
      </div>
    </div>
  </div>
</header>

<main class="zone">
  <div class="chercher">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="recherche" type="search" placeholder="Un plat, ou des ingrédients : poulet crème…" autocomplete="off" aria-label="Rechercher un plat">
    <button class="effacer" id="effacer" hidden aria-label="Effacer la recherche">✕</button>
  </div>
  <div class="onglets" id="onglets" role="tablist"></div>

/* ==========================================================================
   3. MOTEUR (pas besoin d'y toucher pour ajouter des plats)
   ========================================================================== */
const DENOMBRABLES = ["pièce","tranche","pain","pot","rouleau","feuille","sachet","cube","botte","gousse"];
const PLURIELS = {"tranche":"tranches","pain":"pains","pot":"pots","rouleau":"rouleaux","feuille":"feuilles",
  "sachet":"sachets","cube":"cubes","botte":"bottes","gousse":"gousses","pincée":"pincées","pièce":""};
const CATS = [...new Set(RECETTES.map(r=>r.cat))];
const CAT_EMO = {"Plats":"🍽️","Accompagnements":"🥗","Entrées & apéro":"🥂","Petit-déjeuner":"☕","Desserts":"🍰","Petits gâteaux":"🍪"};

const etat = { pers:2, panier:[], uid:1, extras:[] };
const $ = s => document.querySelector(s);
// Les ligatures ne sont pas décomposées par NFD : sans ça, taper "oeufs" ne trouve pas "Œufs".
const norm = s => (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
                  .replace(/œ/gi,"oe").replace(/æ/gi,"ae").toLowerCase();
/* Articles tapés à la main : absents de PRODUITS, ils vivent ici le temps de la
   session et voyagent dans l'adresse. Toujours rangés dans le rayon "Autres". */
const PERSO = {};
function ajouterPerso(nom,unite){
  if(!PRODUITS[nom] && !PERSO[nom]) PERSO[nom] = {rayon:"Autres",unite:unite||"pièce",lot:null,perso:true};
  return nom;
}
const prod = n => PRODUITS[n] || PERSO[n] || {rayon:"Divers",unite:"pièce",lot:null};
const denombrable = u => DENOMBRABLES.includes(u);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function nb(x){
  const r = Math.round(x*100)/100;
  return String(r).replace(".",",");
}
function fmtQte(q,u){
  if(q<=0) return "0";
  if(u==="g"||u==="ml"){
    if(q>=1000){ const g=Math.round(q/100)/10; return nb(g)+(u==="g"?" kg":" L"); }
    return Math.round(q)+" "+u;
  }
  const s = PLURIELS[u]!==undefined ? PLURIELS[u] : u;
  const arr = Math.round(q*4)/4;
  if(!s) return nb(arr);
  return nb(arr)+" "+(arr>1?s:s.replace(/s$/,""));
}
function pas(q,u){
  if(u==="g"||u==="ml") return q<20?5:q<100?10:q<500?25:50;
  if(u==="pincée") return 1;
  return q<2?0.5:1;
}

/* --- Affichage en articles plutôt qu'en grammes --------------------------- */
const estAlOeil = nom => !!prod(nom).alOeil;
function pluriel(mot,n){
  if(n<=1) return mot;
  if(/al$/.test(mot)) return mot.replace(/al$/,"aux");
  if(/(eau|eu)$/.test(mot)) return mot+"x";
  if(/s$/.test(mot)) return mot;
  return mot+"s";
}
/* Contenu d'un lot : "200 g", "20 tranches", "6" pour des pièces. */
function fmtLot(q,u){
  if(u==="pièce") return nb(q);
  return fmtQte(q,u);
}
/* Ce qu'on attrape en rayon : "2 barquettes de 200 g", "1 paquet de 20 tranches". */
function fmtAchat(l){
  const p = prod(l.nom);
  const art = p.contenant || "paquet";
  if(p.alOeil) return l.lot ? "1 "+art : "à vérifier";
  if(!l.lot) return fmtQte(l.acheter,l.unite);
  if(l.lot===1) return nb(l.lots)+" "+pluriel(art,l.lots);
  return nb(l.lots)+" "+pluriel(art,l.lots)+" de "+fmtLot(l.lot,l.unite);
}
/* Quantité d'un ingrédient dans une recette : un condiment n'a pas de gramme utile. */
function fmtIngredient(nom,q){
  return estAlOeil(nom) ? "au goût" : fmtQte(q,prod(nom).unite);
}
/* Lien direct : uniquement si la recette porte un champ mm renseigné à la main.
   On vérifie que c'est bien une URL Marmiton, pour ne pas ouvrir n'importe quoi. */
function lienMarmitonExact(r){
  const u = (r.mm||"").trim();
  if(!u) return null;
  try{
    const url = new URL(u);
    if(url.protocol!=="https:" && url.protocol!=="http:") return null;
    if(!/(^|\.)marmiton\.org$/i.test(url.hostname)) return null;
    return url.href;
  }catch(e){ return null; }
}
/* Lien vers la recherche Marmiton (jamais un lien mort, contrairement à une URL devinée). */
const MARMITON_TYPE = {"Plats":"platprincipal","Accompagnements":"accompagnement",
  "Entrées & apéro":"entree","Desserts":"dessert","Petits gâteaux":"dessert"};
function lienMarmiton(r){
  const dt = MARMITON_TYPE[r.cat];
  return "https://www.marmiton.org/recettes/recherche.aspx?aqt="+encodeURIComponent(r.nom)
       + (dt ? "&dt="+dt : "");
}
function achatArrondi(q,u,lot){
  if(lot){ const n=Math.ceil(q/lot-1e-9); return {acheter:n*lot, lots:n}; }
  if(u==="g"||u==="ml"){ const a=Math.ceil(q/10-1e-9)*10; return {acheter:a, lots:null}; }
  return {acheter:Math.ceil(q-1e-9), lots:null};
}

/* --------------------------- Panier --------------------------- */
const recette = id => RECETTES.find(r=>r.id===id);
function multParDefaut(r){ return r.fixe ? 1 : etat.pers; }
function nouvelItem(r,mult){
  return { uid:etat.uid++, rid:r.id, mult, qtes:r.ing.map(([,q])=>q*mult), extras:[], suivi:!r.fixe };
}
function majMult(item,nouveau){
  const r = recette(item.rid), anc = item.mult||1;
  item.qtes = item.qtes.map((q,i)=> q<=0 ? 0 : (anc? q*nouveau/anc : r.ing[i][1]*nouveau));
  if(item.avant) Object.keys(item.avant).forEach(k=>{ item.avant[k] = item.avant[k]*nouveau/anc; });
  (item.extras||[]).forEach(e=>{ e.q = Math.round(e.q*nouveau/anc*100)/100; });
  item.mult = nouveau;
}
function libPortion(item){
  const r = recette(item.rid);
  if(r.fixe) return `${nb(item.mult)} ${r.unite||"lot"}${item.mult>1?"s":""}`;
  return `${nb(item.mult)} pers.`;
}
function totalPlats(){ return etat.panier.length; }

/* ------------------------ Liste de courses ------------------------ */
function agreger(){
  const m = new Map();
  const ajoute = (nom,q)=>{ if(q>0) m.set(nom,(m.get(nom)||0)+q); };
  etat.panier.forEach(item=>{
    const r = recette(item.rid);
    r.ing.forEach(([nom],i)=>ajoute(nom, item.qtes[i]));
    (item.extras||[]).forEach(e=>ajoute(e.nom, e.q));
  });
  etat.extras.forEach(e=>ajoute(e.nom, e.q));
  const lignes=[];
  m.forEach((besoin,nom)=>{
    const p = prod(nom);
    const {acheter,lots} = achatArrondi(besoin,p.unite,p.lot);
    lignes.push({nom, rayon:p.rayon, unite:p.unite, lot:p.lot, stock:!!p.stock, besoin, acheter, lots, reste:acheter-besoin});
  });
  lignes.sort((a,b)=>{
    const d = RAYONS.indexOf(a.rayon)-RAYONS.indexOf(b.rayon);
    return d!==0?d:a.nom.localeCompare(b.nom,"fr");
  });
  return lignes;
}
function resteVisible(l){
  if(l.stock) return false;            // produit d'armoire : pas un reste à écouler
  if(l.reste<=0.001) return false;
  if(l.unite==="g"||l.unite==="ml") return l.reste>=5;
  if(l.unite==="pincée") return false;
  return Math.round(l.reste*4)/4>0;
}

/* ============================== VUES ============================== */
let catActive = "Tout", requete = "";

function rendreOnglets(){
  const o = $("#onglets");
  const libelle = c => c==="Tout" ? "Tout" : c==="Express" ? "⚡ Express" : (CAT_EMO[c]||"")+" "+c;
  o.innerHTML = ["Tout","Express",...CATS].map(c=>
    `<button class="onglet" role="tab" data-cat="${esc(c)}" aria-selected="${c===catActive}">${esc(libelle(c))}</button>`).join("");
}
function rendreGrille(){
  const termes = norm(requete).split(/[\s,]+/).filter(Boolean);
  let liste;
  if(termes.length){
    // Recherche par ingrédients : tous les termes doivent être présents.
    liste = [];
    RECETTES.forEach(r=>{
      const nomN = norm(r.nom), autreN = norm(r.cat+" "+(r.sc||"")+" "+(r.note||"")+(r.express?" express rapide etudiant facile":""));
      const trouves = [];
      const ok = termes.every(t=>{
        const ing = r.ing.find(([n])=>norm(n).includes(t));
        if(ing){ if(!trouves.includes(ing[0])) trouves.push(ing[0]); return true; }
        return nomN.includes(t) || autreN.includes(t);
      });
      if(!ok) return;
      const dansNom = termes.some(t=>nomN.includes(t));
      liste.push({r, dansNom, trouves});
    });
    // Un plat qui porte le mot dans son nom passe devant ; sinon, le plus d'ingrédients trouvés.
    liste.sort((a,b)=> (b.dansNom-a.dansNom) || (b.trouves.length-a.trouves.length));
  } else {
    liste = RECETTES.filter(r=>{
      if(catActive==="Express") return !!r.express;
      if(catActive!=="Tout" && r.cat!==catActive) return false;
      return true;
    }).map(r=>({r,dansNom:true,trouves:[]}));
  }
  const g = $("#grille");
  if(!liste.length){
    g.innerHTML = `<div class="vide"><b>Aucune recette ne correspond</b>Essaie avec un seul ingrédient, ou ajoute la recette dans le fichier&nbsp;: elle apparaîtra ici.</div>`;
    return;
  }
  // Vue d'ensemble : on regroupe par catégorie. Dans une catégorie : par famille.
  const parFamille = !termes.length && catActive!=="Tout" && catActive!=="Express";
  const cle = r => parFamille ? (r.sc||r.cat) : r.cat;
  const ordre = [], groupes = new Map();
  liste.forEach(o=>{
    const k = cle(o.r);
    if(!groupes.has(k)){ groupes.set(k,[]); ordre.push(k); }
    groupes.get(k).push(o);
  });
  const compte = {};
  etat.panier.forEach(i=>compte[i.rid]=(compte[i.rid]||0)+1);
  const multi = ordre.length>1;
  let html = "";
  ordre.forEach(k=>{
    if(multi) html += `<h2 class="titre-section">${esc(k)} <span>${groupes.get(k).length}</span></h2>`;
    html += groupes.get(k).map(({r,dansNom,trouves})=>{
      let meta;
      if(compte[r.id]) meta = `<span class="pastille">${compte[r.id]}</span>au menu`;
      else if(trouves.length && !dansNom) meta = `<span class="avec">avec ${esc(trouves.slice(0,2).join(", ").toLowerCase())}</span>`;
      else meta = esc(r.note||r.ing.length+" ingrédients");
      return `
      <button class="plat" data-id="${esc(r.id)}">
        <span class="emo">${r.emo||"🍽️"}${r.express?'<i class="eclair" title="Prêt en ~20 min">⚡</i>':""}</span>
        <span class="nom">${esc(r.nom)}</span>
        <span class="meta">${meta}</span>
      </button>`;
    }).join("");
  });
  g.innerHTML = html;
}
function rendreBarre(){
  const n = totalPlats(), vide = n===0 && !etat.extras.length;
  $("#nb-plats").textContent = n;

/* ---------- Mémoire du menu dans l'URL ----------
   Pas de stockage navigateur : le menu vit dans le # de l'adresse. Il survit à un
   rafraîchissement, et l'adresse peut se transmettre telle quelle à quelqu'un d'autre. */
let ecritureHash = false;
let ouvrirTicketAuChargement = false;

/* Un nom d'article libre peut contenir espaces, accents, apostrophes : on ne
   garde que lettres et chiffres, tout le reste devient _hh (octets UTF-8).
   L'adresse reste entièrement en ASCII, donc collable telle quelle. */
function codeNom(s){
  let out = "";
  new TextEncoder().encode(s).forEach(b=>{
    const c = String.fromCharCode(b);
    out += /[A-Za-z0-9]/.test(c) ? c : "_"+b.toString(16).padStart(2,"0");
  });
  return out;
}
function decodeNom(s){
  const o = [];
  for(let i=0;i<s.length;i++){
    if(s[i]==="_"){ o.push(parseInt(s.substr(i+1,2),16)); i+=2; }
    else o.push(s.charCodeAt(i));
  }
  return new TextDecoder().decode(new Uint8Array(o));
}
/* Un ajout : nom:quantité, plus le code d'unité quand l'article est hors catalogue
   (c'est ce troisième champ qui dit au lecteur de recréer le produit). */
const CODE_UNITE = {"pièce":"p","g":"g","ml":"m"};
const UNITE_CODE = {p:"pièce",g:"g",m:"ml"};
function codeExtras(liste){
  return (liste||[]).map(e=>{
    const p = prod(e.nom);
    return codeNom(e.nom)+":"+(Math.round(e.q*100)/100)+(p.perso?":"+(CODE_UNITE[p.unite]||"p"):"");
  }).join(",");
}
function decodeExtras(txt){
  return (txt||"").split(",").filter(Boolean).map(bloc=>{
    const [n,q,u] = bloc.split(":");
    const nom = decodeNom(n||""), val = Number(q);
    if(!nom || !(val>0)) return null;
    if(u) ajouterPerso(nom, UNITE_CODE[u]||"pièce");
    return {nom, q:val};
  }).filter(Boolean);
}
/* Format : personnes ~ plats ~ ajouts ~ options
   un plat : id * portions * quantités * ajouts du plat
   Les deux derniers champs sont facultatifs : les anciennes adresses marchent encore. */
function encoderMenu(options){
  if(!etat.panier.length && !etat.extras.length) return "";
  const plats = etat.panier.map(i=>{
    const bloc = i.rid+"*"+i.mult+"*"+i.qtes.map(q=>Math.round(q*100)/100).join("-");
    const ex = codeExtras(i.extras);
    return ex ? bloc+"*"+ex : bloc;
  }).join("!");
  const champs = [etat.pers, plats, codeExtras(etat.extras), options||""];
  while(champs.length>2 && !champs[champs.length-1]) champs.pop();
  return champs.join("~");
}
function decoderMenu(txt){
  if(!txt) return false;
  try{
    const [pers,plats,extras,options] = txt.split("~");
    const n = parseInt(pers,10);
    if(!(n>=1 && n<=30)) return false;
    const panier = [];
    (plats||"").split("!").filter(Boolean).forEach(bloc=>{
      const [rid,mult,qtes,ex] = bloc.split("*");
      const r = recette(rid);
      if(!r) return;                                  // recette supprimée du fichier : on l'ignore
      const q = (qtes||"").split("-").map(Number);   // "-" et non "." : les quantités sont décimales
      if(q.length!==r.ing.length || q.some(isNaN)) return;
      panier.push({uid:etat.uid++, rid, mult:Number(mult)||1, qtes:q, extras:decodeExtras(ex), suivi:!r.fixe});
    });
    etat.pers = n; etat.panier = panier; etat.extras = decodeExtras(extras);
    ouvrirTicketAuChargement = (options||"").includes("t");
    return true;
  }catch(e){ return false; }
}
function lienPartage(){
  const code = encoderMenu("t");
  return location.href.split("#")[0] + (code ? "#"+code : "");
}
function memoriser(){
  try{
    ecritureHash = true;
    const m = encoderMenu();
    history.replaceState(null,"", m ? "#"+m : location.pathname+location.search);
  }catch(e){ /* contexte restreint : tant pis, on continue sans mémoire */ }
  finally{ setTimeout(()=>ecritureHash=false,0); }
}
window.addEventListener("hashchange", ()=>{
  if(ecritureHash) return;
  if(!decoderMenu(decodeURIComponent(location.hash.slice(1)))) return;
  fermerFeuille(); rafraichir();
  if(ouvrirTicketAuChargement) dessinerTicket();
});

function rafraichir(){ rendreGrille(); rendreBarre(); memoriser(); }

/* Depuis la feuille d'ajout, on revient à la feuille d'où l'on vient plutôt que
   de tout fermer : on ne perd pas le plat en cours de personnalisation. */
function sortirFeuille(){

/* Met à jour uniquement les chiffres affichés, sans reconstruire la feuille :

/* ================== Articles hors recette ==================
   Deux points d'entrée, même feuille : depuis un plat (l'article compte dans ce
   plat et suit les portions) ou depuis la barre (l'article part directement sur
   la liste de courses). Ce qui n'existe pas dans PRODUITS atterrit dans "Autres". */
let ajoutCible = "global", ajoutRetour = null, ajoutRequete = "", ajoutUnite = "pièce";

function extrasDe(cible){
  if(cible==="plat"){ if(!brouillon.extras) brouillon.extras = []; return brouillon.extras; }
  return etat.extras;
}
/* Même présentation que les ingrédients, mais la corbeille supprime pour de bon :
   l'article ne fait pas partie de la recette, il n'y a rien à "remettre". */
function lignesExtras(liste, cible){
  if(!liste || !liste.length) return "";
  return `<ul class="ingr ajouts">${liste.map((e,i)=>{
    const p = prod(e.nom);
    return `<li>
      <span class="nm">${esc(e.nom)}<i>${esc(p.rayon)}${p.perso?" · hors catalogue":""}</i></span>
      <span class="cmd">
        <button data-act="xq-" data-c="${cible}" data-x="${i}" aria-label="Moins de ${esc(e.nom)}">−</button>
        <b>${esc(fmtQte(e.q,p.unite))}</b>
        <button data-act="xq+" data-c="${cible}" data-x="${i}" aria-label="Plus de ${esc(e.nom)}">+</button>
        <button class="jeter" data-act="xsup" data-c="${cible}" data-x="${i}" title="Supprimer" aria-label="Supprimer ${esc(e.nom)}">${iconeJeter(false)}</button>
      </span></li>`;
  }).join("")}</ul>`;
}
function ouvrirAjout(cible, retour){
  ajoutCible = cible; ajoutRetour = retour||null; ajoutRequete = ""; ajoutUnite = "pièce";
  dessinerAjout();
}
function dessinerAjout(){
  feuilleCourante = dessinerAjout;
  ouvrirFeuille(`
    <div class="feuille-tete">
      <span class="emo">➕</span>
      <div><h2>Ajouter un article</h2><p>${ajoutCible==="plat"?"Il sera compté dans ce plat":"Il ira directement sur la liste de courses"}</p></div>
      <button class="fermer" data-act="ajout-fin" aria-label="Fermer">✕</button>
    </div>
    <div class="feuille-corps">
      <div class="rech-prod">
        <input id="rech-prod" type="search" placeholder="Coriandre, papier toilette, bière…" autocomplete="off" aria-label="Chercher un article">
      </div>
      <div id="ajout-choisis"></div>
      <div id="ajout-resultats"></div>
    </div>
    <div class="feuille-pied">
      <button class="b-valider" data-act="ajout-fin">Terminé</button>
    </div>`);
  const champ = voile.querySelector("#rech-prod");
  if(champ){
    champ.value = ajoutRequete;
    champ.addEventListener("input", e=>{ ajoutRequete = e.target.value; majAjout(); });
    champ.focus();
  }
  majAjout();
}
/* On ne redessine que les deux blocs qui changent : le champ de recherche garde
   son focus et le clavier ne se referme pas sur téléphone. */
function majAjout(){
  const liste = extrasDe(ajoutCible);
  const ch = voile.querySelector("#ajout-choisis");
  if(ch) ch.innerHTML = liste.length
    ? `<p class="titre-mini">Déjà ajoutés</p><div class="choisis">${lignesExtras(liste, ajoutCible)}</div>`
    : "";
  const res = voile.querySelector("#ajout-resultats");
  if(!res) return;

  const brut = (ajoutRequete||"").trim().replace(/\s+/g," ");
  const termes = norm(brut).split(/[\s,]+/).filter(Boolean);
  const catalogue = Object.keys(PRODUITS).concat(Object.keys(PERSO));
  const dejaLa = new Set(liste.map(e=>e.nom));
  let noms = catalogue.filter(n=>!dejaLa.has(n));
  if(termes.length) noms = noms.filter(n=>{ const x = norm(n); return termes.every(t=>x.includes(t)); });
  noms.sort((a,b)=>{
    if(termes.length){                                  // ce qui commence par le mot tapé passe devant
      const da = norm(a).startsWith(termes[0])?0:1, db = norm(b).startsWith(termes[0])?0:1;
      if(da!==db) return da-db;
    }
    const d = RAYONS.indexOf(prod(a).rayon)-RAYONS.indexOf(prod(b).rayon);
    return d!==0 ? d : a.localeCompare(b,"fr");
  });
  // Proposer la création seulement si rien dans le catalogue ne porte déjà ce nom.
  const existe = brut && catalogue.some(n=>norm(n)===norm(brut));
  let html = "";
  if(brut && !existe){
    html += `<div class="unites" role="group" aria-label="Unité de l'article">
      ${[["pièce","à l'unité"],["g","en grammes"],["ml","en ml"]].map(([u,lab])=>
        `<button data-act="unite" data-u="${u}" aria-pressed="${u===ajoutUnite}">${lab}</button>`).join("")}
    </div>`;
  }
  const lignes = [];
  if(brut && !existe) lignes.push(`<li><button class="neuf" data-act="creer">＋ Ajouter « ${esc(brut)} »<span class="ray">Autres</span></button></li>`);
  noms.slice(0,300).forEach(n=>lignes.push(
    `<li><button data-act="prendre" data-n="${esc(n)}">${esc(n)}<span class="ray">${esc(prod(n).rayon)}</span></button></li>`));
  html += lignes.length ? `<ul class="res">${lignes.join("")}</ul>`
                        : `<p class="legende">Rien sous ce nom. Efface une lettre ou deux.</p>`;
  res.innerHTML = html;
}
/* Quantité de départ : le conditionnement du rayon quand on le connaît. */
function ajouterExtra(nom){
  const liste = extrasDe(ajoutCible);
  if(liste.some(e=>e.nom===nom)) return;
  const p = prod(nom);
  liste.push({nom, q: p.lot || (p.unite==="g"||p.unite==="ml" ? 100 : 1)});
  ajoutRequete = "";
  const champ = voile.querySelector("#rech-prod");
  if(champ){ champ.value = ""; champ.focus(); }
  if(ajoutCible==="global"){ rendreBarre(); memoriser(); }
  majAjout();
}

/* Un plat qui contient déjà l'un de ces produits est considéré "a déjà son féculent" :
   inutile de lui proposer un deuxième féculent en accompagnement, mieux vaut un légume. */
const PRODUITS_FECULENTS = new Set([
  "Spaghetti","Pâtes (penne, fusilli…)","Coquillettes","Feuilles de lasagne","Riz long grain",
  "Riz basmati","Riz rond spécial paella","Ébly ou perles Tipiak","Semoule à couscous",
  "Boulgour","Quinoa","Polenta","Lentilles vertes","Lentilles corail","Nouilles ramen",
  "Nouilles chinoises","Nouilles de riz","Pomme de terre","Patate douce","Gnocchi","Ravioles",
  "Tortellini frais","Tagliatelles fraîches","Purée Mousseline (flocons)",
  "Pain de mie Harrys","Pain à burger","Pain à hot-dog","Mauricette","Baguette",
  "Pain de campagne","Tortillas (wraps)","Pain pita",
  "Pâte à pizza","Pâte feuilletée","Pâte brisée","Pâte à flammekueche"
]);
function aDejaUnFeculent(r){ return r.ing.some(([nom])=>PRODUITS_FECULENTS.has(nom)); }

function dessinerSuggestions(r){
  feuilleCourante = null;
  const cats = r.sugg||[];
  const tous = RECETTES.filter(x=>cats.includes(x.cat) && x.id!==r.id);
  if(!tous.length){ fermerFeuille(); return; }

  // On propose TOUT, mais rangé : le groupe le plus pertinent d'abord.
  const parPrio = (a,b)=>(b.prio||0)-(a.prio||0);
  let sections;

  if(cats.includes("Accompagnements")){
    const veutLeger = aDejaUnFeculent(r);          // le plat a déjà sa pâte / son riz / son pain
    const legumes   = tous.filter(x=>!x.feculent).sort(parPrio);
    const feculents = tous.filter(x=> x.feculent).sort(parPrio);
    sections = veutLeger
      ? [{titre:"Léger, pour équilibrer", items:legumes},
         {titre:"Si tu veux un féculent en plus", items:feculents}]
      : [{titre:"Pour compléter l'assiette", items:feculents},
         {titre:"Côté légumes", items:legumes}];
  } else if(cats.includes("Desserts")){
    sections = [{titre:"Sans rien préparer", items:tous.filter(x=>!x.fixe)},
                {titre:"À faire soi-même",   items:tous.filter(x=> x.fixe)}];
  } else {
    sections = [{titre:cats.join(" & "), items:tous}];
  }
  sections = sections.filter(s=>s.items.length);

  const carte = p=>`<button class="plat" data-sugg="${esc(p.id)}">
      <span class="emo">${p.emo||"🍽️"}${p.express?'<i class="eclair">⚡</i>':""}</span>
      <span class="nom">${esc(p.nom)}</span>
      <span class="meta">${esc(p.note||"")}</span></button>`;

  ouvrirFeuille(`
    <div class="feuille-tete">
      <span class="emo">✨</span>
      <div><h2>Avec ça&nbsp;?</h2><p>${esc(r.nom)} vient d'être ajouté au menu</p></div>
      <button class="fermer" data-act="fermer" aria-label="Fermer">✕</button>
    </div>
    <div class="feuille-corps sugg">
      <p class="legende">Facultatif — tu peux passer. Tout est là, fais défiler.</p>
      ${sections.map((s,k)=>`
        <h3 class="sugg-titre${k?" suivant":""}">${esc(s.titre)} <span>${s.items.length}</span></h3>
        <div class="sugg-grille">${s.items.map(carte).join("")}</div>`).join("")}
    </div>
    <div class="feuille-pied">
      <button class="b-valider" data-act="fermer">Non merci, c'est tout</button>
    </div>`);
}

/* --------------------------- Le ticket --------------------------- */
const ecran = $("#ecran");
function fermerEcran(){ ecran.hidden = true; ecran.innerHTML=""; document.body.style.overflow=""; }

function ligneTicket(nomAff, qAff, coche){
  return `<div class="${coche?"case":"lg"}">${coche?'<input type="checkbox">':""}<span class="p">${esc(nomAff)}</span><span class="fil"></span><span class="q">${esc(qAff)}</span></div>`;
}
function dessinerTicket(){
  const lignes = agreger();
  const restes = lignes.filter(resteVisible);
  const d = new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  let parRayon = "";
  let rayonCourant = null;
  lignes.forEach(l=>{
    if(l.rayon!==rayonCourant){ rayonCourant=l.rayon; parRayon += `<div class="rayon">${esc(l.rayon)}</div>`; }
    parRayon += ligneTicket(l.nom, fmtAchat(l), true);
  });

  ecran.innerHTML = `
    <div class="ecran-tete">
      <button class="fermer" data-act="fermer-ecran" aria-label="Revenir aux plats">←</button>
      <h2>Ma liste</h2>
      <div class="outils">
        <button data-act="partager">Partager</button>
        <button data-act="copier">Copier</button>
        <button data-act="imprimer">Imprimer</button>
      </div>
    </div>
    <div class="papier-wrap"><div class="papier">
      <div class="t-tete">
        <h1>LA BORNE : rue du charmois 💕</h1>
        <p>${esc(d)}</p>
        <p>${etat.pers} personne${etat.pers>1?"s":""} · ${totalPlats()} plat${totalPlats()>1?"s":""}</p>
      </div>
      <div class="sep-forte"></div>
      <p class="t-titre">Au menu</p>
      ${etat.panier.map(i=>{
        const r = recette(i.rid);
        const ings = r.ing.map(([nom],k)=>({nom,q:i.qtes[k]})).filter(x=>x.q>0);
        return `<div class="t-plat">
          <div class="t-plat-nom"><span>${esc(r.nom)}</span><span class="pf">${libPortion(i)}</span></div>
          ${ings.map(x=>ligneTicket(x.nom, fmtIngredient(x.nom,x.q), false)).join("")}
          ${(i.extras||[]).map(e=>ligneTicket("+ "+e.nom, fmtQte(e.q,prod(e.nom).unite), false)).join("")}
        </div>`;
      }).join("")}
      ${etat.extras.length?`<div class="t-plat">
        <div class="t-plat-nom"><span>En plus</span><span class="pf">hors recette</span></div>
        ${etat.extras.map(e=>ligneTicket(e.nom, fmtQte(e.q,prod(e.nom).unite), false)).join("")}
      </div>`:""}
      <div class="sep-forte"></div>
      <p class="t-titre">Liste de courses — ${lignes.length} article${lignes.length>1?"s":""}</p>
      ${parRayon}
      ${restes.length?`
        <div class="sep"></div>
        <p class="t-titre">Restes après ces repas</p>
        ${restes.map(l=>`<div class="reste"><span>${esc(l.nom)}</span><span class="q">${fmtQte(l.reste,l.unite)}</span></div>`).join("")}
        <p class="t-pied" style="margin-top:10px;font-size:11.5px">De quoi caler le prochain menu.</p>`:""}
      <div class="sep-forte"></div>
      <div class="t-pied">
        <div>MERCI ET BON APPÉTIT</div>
        <div class="codebarres"></div>
        <div>*** ${lignes.length} ARTICLES ***</div>
      </div>
    </div></div>`;
  ecran.hidden = false;
  document.body.style.overflow = "hidden";
  ecran.scrollTop = 0;
}

function ticketTexte(){
  const lignes = agreger(), restes = lignes.filter(resteVisible);
  const L = [];
  L.push("LISTE DE COURSES — "+new Date().toLocaleDateString("fr-FR"));
  L.push(etat.pers+" personnes · "+totalPlats()+" plats","");
  L.push("== AU MENU ==");
  etat.panier.forEach(i=>{
    const r = recette(i.rid);
    L.push("");
    L.push(r.nom.toUpperCase()+"  ("+libPortion(i)+")");
    r.ing.forEach(([nom],k)=>{ if(i.qtes[k]>0) L.push("   - "+nom+" : "+fmtQte(i.qtes[k],prod(nom).unite)); });
    (i.extras||[]).forEach(e=>L.push("   + "+e.nom+" : "+fmtQte(e.q,prod(e.nom).unite)));
  });
  if(etat.extras.length){
    L.push("");
    L.push("EN PLUS  (hors recette)");
    etat.extras.forEach(e=>L.push("   - "+e.nom+" : "+fmtQte(e.q,prod(e.nom).unite)));
  }
  L.push("","== LISTE DE COURSES ==");
  let ray = null;
  lignes.forEach(l=>{
    if(l.rayon!==ray){ ray=l.rayon; L.push("","["+ray+"]"); }
    const det = (l.lots && (l.lots>1||l.reste>0.001)) ? "  ("+l.lots+"x"+fmtQte(l.lot,l.unite)+")" : "";
    L.push("[ ] "+l.nom+" : "+fmtQte(l.acheter,l.unite)+det);
  });
  if(restes.length){
    L.push("","== RESTES ==");
    restes.forEach(l=>L.push("   "+l.nom+" : "+fmtQte(l.reste,l.unite)));
  }
  return L.join("\n");
}
async function copierTexte(txt, btn, confirmation){
  try{ await navigator.clipboard.writeText(txt); }
  catch(e){
    const t=document.createElement("textarea"); t.value=txt; t.style.position="fixed"; t.style.opacity="0";
    document.body.appendChild(t); t.select();
    try{ document.execCommand("copy"); }catch(_){}
    t.remove();
  }
  const anc = btn.textContent; btn.textContent = confirmation;
  setTimeout(()=>btn.textContent = anc, 1600);
}
const copierTicket = btn => copierTexte(ticketTexte(), btn, "Copié ✓");

$("#pers-moins").addEventListener("click", ()=>changerPers(-1));
$("#pers-plus").addEventListener("click", ()=>changerPers(1));
function changerPers(d){
  const anc = etat.pers;
  etat.pers = Math.min(30, Math.max(1, etat.pers+d));
  if(etat.pers===anc) return;
  etat.panier.forEach(i=>{ if(i.suivi && i.mult===anc) majMult(i, etat.pers); });
  rafraichir();
}
$("#ouvrir-ajout").addEventListener("click", ()=>ouvrirAjout("global", null));
$("#ouvrir-panier").addEventListener("click", dessinerPanier);
$("#ouvrir-ticket").addEventListener("click", dessinerTicket);

voile.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  const act = b.dataset.act;

  if(b.dataset.sugg){ 
    const r = recette(b.dataset.sugg);
    etat.panier.push(nouvelItem(r, multParDefaut(r)));
    rafraichir(); fermerFeuille(); return;
  }
  if(b.dataset.edit){ ouvrirPlat(etat.panier.find(i=>i.uid==b.dataset.edit).rid, +b.dataset.edit); return; }
  if(b.dataset.sup){
    etat.panier = etat.panier.filter(i=>i.uid!=b.dataset.sup);
    rafraichir();
    if(totalPlats()) dessinerPanier(); else fermerFeuille();
    return;
  }
  if(act==="fermer"){ fermerFeuille(); return; }
  if(act==="vider"){ etat.panier=[]; etat.extras=[]; rafraichir(); fermerFeuille(); return; }
  if(act==="ticket"){ fermerFeuille(); dessinerTicket(); return; }
  if(act==="copier-lien"){ copierTexte(lienPartage(), b, "Lien copié ✓"); return; }
  if(act==="partage-natif"){
    navigator.share({title:"Ma liste de courses", url:lienPartage()}).catch(()=>{});
    return;
  }

  /* --- articles hors recette --- */
  if(act==="ajout-global"||act==="ajout-panier"){ ouvrirAjout("global", dessinerPanier); return; }
  if(act==="ajout-plat"){ ouvrirAjout("plat", dessinerPlat); return; }
  if(act==="ajout-fin"){ sortirFeuille(); return; }
  if(act==="unite"){ ajoutUnite = b.dataset.u; majAjout(); return; }
  if(act==="creer"){
    const nom = (ajoutRequete||"").trim().replace(/\s+/g," ");
    if(!nom) return;
    ajouterPerso(nom, ajoutUnite);
    ajouterExtra(nom);
    return;
  }
  if(act==="prendre"){ ajouterExtra(b.dataset.n); return; }
  if(act==="xq-"||act==="xq+"||act==="xsup"){
    const liste = extrasDe(b.dataset.c), i = +b.dataset.x, e = liste[i];
    if(!e) return;
    if(act==="xsup") liste.splice(i,1);
    else {
      const d = pas(e.q, prod(e.nom).unite);
      e.q = Math.max(0, Math.round((e.q + (act==="xq+"?d:-d))*100)/100);
      if(e.q<=0) liste.splice(i,1);
    }
    if(b.dataset.c==="global"){ rendreBarre(); memoriser(); }
    redessinerFeuille();
    return;
  }

  if(!brouillon) return;
  const r = recette(brouillon.rid);
  if(act==="mult-"||act==="mult+"){
    const v = Math.min(40, Math.max(1, brouillon.mult + (act==="mult+"?1:-1)));
    if(v!==brouillon.mult){ majMult(brouillon,v); brouillon.suivi = !r.fixe && v===etat.pers; majPortions(); }
    return;
  }
  if(act==="q-"||act==="q+"){
    const i = +b.dataset.i, u = prod(r.ing[i][0]).unite;
    let q = brouillon.qtes[i];
    const p = pas(q>0?q:r.ing[i][1]*brouillon.mult, u);
    q = act==="q+" ? q+p : q-p;
    brouillon.qtes[i] = Math.max(0, Math.round(q*100)/100);
    majLigneIngredient(i);
    return;
  }
  if(act==="jeter"){
    const i = +b.dataset.i;
    brouillon.avant = brouillon.avant || {};
    if(brouillon.qtes[i] > 0){
      brouillon.avant[i] = brouillon.qtes[i];      // on garde la quantité de côté
      brouillon.qtes[i] = 0;
    } else {
      brouillon.qtes[i] = brouillon.avant[i] ?? r.ing[i][1]*brouillon.mult;
    }
    majLigneIngredient(i);
    return;
  }
  if(act==="retirer"){
    etat.panier = etat.panier.filter(i=>i.uid!==brouillon.uid);
    brouillon=null; rafraichir(); fermerFeuille(); return;
  }
  if(act==="valider"){
    if(brouillonEdition){
      const k = etat.panier.findIndex(i=>i.uid===brouillon.uid);
      etat.panier[k] = brouillon; rafraichir(); fermerFeuille();
    } else {
      etat.panier.push(brouillon); rafraichir();
      const rr = recette(brouillon.rid); brouillon=null;
      if(rr.sugg && rr.sugg.length) dessinerSuggestions(rr); else fermerFeuille();
    }
    return;
  }
});

ecran.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  const act = b.dataset.act;
  if(act==="fermer-ecran") fermerEcran();
  if(act==="partager") dessinerPartage();
  if(act==="imprimer") window.print();
  if(act==="copier") copierTicket(b);
});

try{ decoderMenu(decodeURIComponent(location.hash.slice(1))); }catch(e){}
rendreOnglets(); rafraichir();
/* Adresse de partage : on arrive directement sur le ticket. */
if(ouvrirTicketAuChargement && (etat.panier.length || etat.extras.length)) dessinerTicket();
